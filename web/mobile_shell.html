<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10172e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BONK!">
  <link rel="manifest" href="bonk.webmanifest?v=orbit-v2">
  <title>BONK!</title>
  $GODOT_HEAD_INCLUDE
  <link rel="icon" type="image/png" sizes="64x64" href="assets/icons/bonk-icon-64.png?v=orbit-v2">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #10172e; overflow: hidden; overscroll-behavior: none; }
    #game { width: var(--app-width, 100%); height: var(--app-height, 100dvh); padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 18px; padding: 24px; background: #10172e; color: #f5f1e5; text-align: center; font: 16px system-ui, sans-serif; }
    #status[hidden] { display: none; }
    #status::before { content: ""; width: clamp(112px, 34vw, 168px); aspect-ratio: 1; border-radius: 24%; background: url("index.png?v=orbit-v2") center / contain no-repeat; filter: drop-shadow(0 12px 24px rgba(0, 0, 0, .38)); }
    #status strong { font-size: 26px; letter-spacing: 3px; }
    progress { width: min(240px, 75vw); height: 8px; accent-color: #8ff0ce; }
    #notice.debug-output { display: block; width: min(100%, 780px); max-height: 68vh; padding: 12px; border: 1px solid #53627c; border-radius: 10px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; text-align: left; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; user-select: text; -webkit-user-select: text; }
    #copy-debug { display: none; min-height: 44px; padding: 10px 18px; border: 1px solid #8ff0ce; border-radius: 12px; background: #23324d; color: #f5f1e5; font: bold 14px system-ui, sans-serif; }
    #copy-debug.visible { display: block; }
    #rotate { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; padding: 24px; background: #19213e; color: #f5f1e5; font: bold 22px system-ui, sans-serif; text-align: center; touch-action: none; }
    #rotate[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="game"><canvas id="canvas" tabindex="0" aria-label="BONK! game"></canvas></div>
  <div id="status" role="status"><progress id="progress"></progress><span id="notice">Loading窶ｦ</span><button id="copy-debug" type="button">Copy diagnostics</button></div>
  <div id="rotate" role="status" hidden>Rotate your phone to portrait to play.<br>Your game is paused.</div>
  <noscript>Enable JavaScript to play.</noscript>
  <script src="$GODOT_URL" crossorigin="anonymous"></script>
  <script>
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    const notice = document.getElementById('notice');
    const rotate = document.getElementById('rotate');
    const copyDebug = document.getElementById('copy-debug');
    // Mirror the in-game preference for browser-owned loading/rotation UI.
    window.setBonkLanguage = language => {
      const messages = {
        en: ['Loading…', 'Rotate your phone to portrait to play.\nYour game is paused.', 'Copy diagnostics'],
        ja: ['読み込み中…', 'スマートフォンを縦にしてください。\nゲームは一時停止中です。', '診断情報をコピー'],
        vi: ['Đang tải…', 'Xoay điện thoại dọc để chơi.\nTrò chơi đang tạm dừng.', 'Sao chép chẩn đoán']
      };
      if (!messages[language]) language = 'en';
      document.documentElement.lang = language;
      rotate.textContent = messages[language][1];
      rotate.style.whiteSpace = 'pre-line';
      if (!notice.classList.contains('debug-output')) notice.textContent = messages[language][0];
      copyDebug.textContent = messages[language][2];
      try { localStorage.setItem('bonk-language', language); } catch (_) {}
    };
    let savedLanguage = 'en';
    try { savedLanguage = localStorage.getItem('bonk-language') || 'en'; } catch (_) {}
    window.setBonkLanguage(savedLanguage);
    const coarsePointer = typeof window.matchMedia === 'function' && matchMedia('(any-pointer: coarse)').matches;
    window.orbitMobile = (navigator.userAgentData && navigator.userAgentData.mobile === true) ||
      (navigator.maxTouchPoints > 0 && coarsePointer) || /iPhone|iPad|iPod/i.test(navigator.userAgent);
    let gameReady = false;
    let startupStage = 'Preparing canvas';
    let diagnosticsText = '';
    let errorShown = false;
    let config = null;
    let startupWatchdog = null;
    const browserWarnings = [];
    const engineMessages = [];

    // Earlier PWA exports installed a cache-first worker under this origin.
    // Wait for its registrations and caches to be removed before Godot fetches
    // the pack; an unregistered worker can still control the current page.
    const legacyCacheCleanup = (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations
            .filter(registration => {
              const scriptURL = registration.active?.scriptURL ||
                registration.waiting?.scriptURL || registration.installing?.scriptURL || '';
              return scriptURL.endsWith('.service.worker.js');
            })
            .map(registration => registration.unregister()));
        }
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames
            .filter(name => name.startsWith('BONK!-sw-cache-'))
            .map(name => caches.delete(name)));
        }
      } catch (error) {
        console.warn('Could not retire legacy game cache:', error);
      }
    })();

    function watchStartup() {
      clearTimeout(startupWatchdog);
      if (gameReady || errorShown) return;
      startupWatchdog = setTimeout(() => {
        void showStartupError(new Error('Game startup stopped responding for two minutes. Reload to try again.'));
      }, 120000);
    }

    function rememberBrowserWarning(message) {
      browserWarnings.push(String(message));
      if (browserWarnings.length > 5) browserWarnings.shift();
      console.warn('Unattributed browser error (waiting for Godot startup result):', message);
    }

    function isInjectedWalletError(error) {
      const message = error && error.message ? error.message : String(error || '');
      // Brave's injected wallet script can throw at the page URL, line 1.
      // BONK! never accesses ethereum; match this assignment specifically.
      return /evaluating ['"]window\\?\.ethereum\.selectedAddress\s*=\s*undefined['"]/.test(message);
    }

    function updateOrientation() {
      rotate.hidden = errorShown || !gameReady || canvas.clientWidth < canvas.clientHeight;
    }

    function resizeGame() {
      document.documentElement.style.setProperty('--app-width', `${window.visualViewport?.width || window.innerWidth}px`);
      document.documentElement.style.setProperty('--app-height', `${window.visualViewport?.height || window.innerHeight}px`);
      // Retain the existing pixel-density cap to avoid large phone framebuffers.
      const density = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.max(1, Math.round(canvas.clientWidth * density));
      const height = Math.max(1, Math.round(canvas.clientHeight * density));
      if (canvas.width !== width) canvas.width = width;
      if (canvas.height !== height) canvas.height = height;
      updateOrientation();
    }
    resizeGame();
    window.addEventListener('resize', resizeGame);
    if (window.visualViewport && typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', resizeGame);
    }
    if (typeof window.ResizeObserver === 'function') {
      new ResizeObserver(resizeGame).observe(document.getElementById('game'));
    }
    canvas.addEventListener('contextmenu', event => event.preventDefault());

    function errorDetails(error) {
      const name = error && error.name ? error.name : typeof error;
      const message = error && error.message ? error.message : String(error);
      const stack = error && error.stack ? error.stack : '(Safari did not provide a stack trace)';
      return `Type: ${name}\nMessage: ${message}\nStack: ${stack}`;
    }

    async function resourceCheck(filename) {
      const url = new URL(encodeURIComponent(filename), document.baseURI);
      try {
        // HEAD is a lightweight diagnostic. Its failure does not prove a bad export.
        const response = await fetch(url, { method: 'HEAD', cache: 'no-store' });
        return `${filename}: HTTP ${response.status}, content-type=${response.headers.get('content-type') || '(missing)'}, size=${response.headers.get('content-length') || '(unknown)'}`;
      } catch (error) {
        return `${filename}: request failed: ${error && error.message ? error.message : String(error)}`;
      }
    }

    async function showStartupError(error) {
      console.error('BONK! startup failed during ' + startupStage, error);
      // Keep the first error as the primary one, instead of overwriting it with
      // secondary resource or error-handler failures.
      if (errorShown) return;
      errorShown = true;
      clearTimeout(startupWatchdog);
      status.hidden = false;
      rotate.hidden = true;
      progress.hidden = true;
      notice.classList.add('debug-output');
      copyDebug.classList.add('visible');
      const wasm = config && config.executable ? `${config.executable}.wasm` : null;
      const pack = config && (config.mainPack || `${config.executable}.pck`);
      const lines = [
        'BONK! startup failure',
        `Stage: ${startupStage}`,
        errorDetails(error),
        `URL: ${location.href}`,
        `WebGL2 available: ${Boolean(document.createElement('canvas').getContext('webgl2'))}`,
        `WebAssembly available: ${typeof WebAssembly !== 'undefined'}`,
        `Cross-origin isolated: ${Boolean(window.crossOriginIsolated)}`,
        `Browser: ${navigator.userAgent}`,
        `Engine output:\n${engineMessages.join('\n') || '(none)'}`,
        `Unattributed browser errors:\n${browserWarnings.join('\n') || '(none)'}`,
        '',
        'Checking deployed files窶ｦ',
      ];
      diagnosticsText = lines.join('\n');
      notice.textContent = diagnosticsText;
      const fileNames = [wasm, pack].filter(Boolean);
      if (fileNames.length) {
        const checks = await Promise.all(fileNames.map(resourceCheck));
        diagnosticsText += '\n' + checks.join('\n');
      } else {
        diagnosticsText += '\nExport configuration was unavailable.';
      }
      notice.textContent = diagnosticsText;
    }

    copyDebug.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(diagnosticsText);
        copyDebug.textContent = 'Copied!';
      } catch (_) {
        // iOS versions that block Clipboard API can still select the text.
        copyDebug.textContent = 'Select the text above to copy';
      }
    });

    window.addEventListener('error', event => {
      if (isInjectedWalletError(event.error || event.message)) {
        rememberBrowserWarning(event.error ? event.error.message : event.message);
        return;
      }
      // WebKit can report errors from injected browser scripts without any source
      // or Error object. That alone does not mean the game has failed.
      if (!event.error && /^Script error\.?$/i.test(event.message || '') &&
          !event.filename && !event.lineno && !event.colno) {
        rememberBrowserWarning(event.message);
        return;
      }
      void showStartupError(event.error || event.message || 'Unspecified browser error');
    });
    window.addEventListener('unhandledrejection', event => {
      if (isInjectedWalletError(event.reason)) {
        rememberBrowserWarning(event.reason.message || event.reason);
        return;
      }
      void showStartupError(event.reason || 'Unspecified promise rejection');
    });

    async function startOrbit() {
      try {
        startupStage = 'Clearing legacy mobile cache';
        await legacyCacheCleanup;
        startupStage = 'Reading Godot export configuration';
        config = $GODOT_CONFIG;
        startupStage = 'Checking browser features';
        const missing = Engine.getMissingFeatures({ threads: $GODOT_THREADS_ENABLED });
        if (missing.length) {
          void showStartupError(new Error(`Missing browser features: ${missing.join(', ')}`));
        } else {
          startupStage = 'Downloading WASM/PCK and starting Godot';
          const engine = new Engine(config);
          watchStartup();
          engine.startGame({ canvas, onPrintError(...messages) {
            engineMessages.push(messages.join(' '));
            if (engineMessages.length > 12) engineMessages.shift();
            console.error(...messages);
          }, onProgress(current, total) {
            watchStartup();
            if (total > 0) { progress.max = total; progress.value = current; }
          }}).then(() => {
            clearTimeout(startupWatchdog);
            if (errorShown) return;
            startupStage = 'Game running';
            status.hidden = true;
            gameReady = true;
            resizeGame();
          }).catch(error => { void showStartupError(error); });
        }
      } catch (error) {
        void showStartupError(error);
      }
    }
    void startOrbit();
  </script>
</body>
</html>
